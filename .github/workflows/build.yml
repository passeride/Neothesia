name: Build

on: 
  push:
    branches:    
      - master
  pull_request:
  workflow_dispatch:

jobs:
  chord_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test chord recognition, note reading, training, and live MIDI state
        shell: bash
        run: |
          rustc --edition=2024 --test neothesia-core/src/chords/mod.rs -o /tmp/chord-tests
          /tmp/chord-tests
          rustc --edition=2024 --test neothesia-core/src/score.rs -o /tmp/score-tests
          /tmp/score-tests

  lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install alsa
        shell: bash
        run: sudo apt update && sudo apt install libasound2-dev libavcodec-dev libavformat-dev libswscale-dev nasm
      - name: Test core behavior and saved appearance preferences
        shell: bash
        run: cargo test -p neothesia-core --lib --locked
      - name: Test MIDI tempo timeline
        shell: bash
        run: cargo test -p midi-file --lib --locked
      - name: Fmt
        shell: bash
        run: cargo fmt --check
      - name: Fmt
        shell: bash
        run: cargo clippy --workspace -- -D warnings 

  build_ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: Build
        uses: ./.github/actions/ubuntu
      - name: ls
        run: ls -l app.zip

  build_ubuntu_recorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: Build
        uses: ./.github/actions/ubuntu-recorder
      - name: ls
        run: ls -l app.zip

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - id: Build
        uses: ./.github/actions/windows
      - name: ls
        run: ls -l target/release/neothesia.exe

  build_windows_recorder:
    runs-on: windows-latest

    env:
      FFMPEG_DOWNLOAD_URL: https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-full_build-shared.7z
      
    steps:
      - uses: actions/checkout@v7
      - id: Build
        uses: ./.github/actions/windows-recorder
      - name: ls
        run: ls -l target/release/neothesia-cli.exe

  build_macos:
    runs-on: macos-latest

    env:
      MACOSX_DEPLOYMENT_TARGET: 10.12

    steps:
      - uses: actions/checkout@v7
      - id: Build
        uses: ./.github/actions/macos
      - name: ls
        run: ls -l .github/app/app.zip

